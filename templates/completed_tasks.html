<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<div class="page-header">
    <h1>✅ Completed Tasks</h1>

    <a href="/dashboard" class="register-btn">
        ← Dashboard
    </a>
</div>

{% if tasks %}

    {% for task in tasks %}

    <div class="task-card">

        <div class="task-info">

            <h2>{{ task[2] }}</h2>

            <p>{{ task[3] }}</p>

            <p>📅 Due: {{ task[4] }}</p>

            <p>
                Priority:
                <span class="priority {{ task[5]|lower }}">
                    {{ task[5] }}
                </span>
            </p>

        </div>

        <div class="task-buttons">

            <a href="/delete_task/{{ task[0] }}"
               class="delete-btn"
               onclick="return confirm('Are you sure you want to delete this task?');">
               🗑 Delete
            </a>

        </div>

    </div>

    {% endfor %}

{% else %}

    <div class="empty-state">
        <h2>🎉 No completed tasks yet</h2>
        <p>Complete a task and it will appear here.</p>
    </div>

{% endif %}
